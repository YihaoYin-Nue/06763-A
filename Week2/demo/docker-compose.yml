# PostgreSQL for the L3 demo and Assignment 2.
#
#   docker compose up -d      # start, on localhost:5432
#   docker compose down       # stop, keep data
#   docker compose down -v     # stop and wipe the volume
#
# The database name, user, and password match the connection string in
# l03-sql-timeseries.ipynb (postgresql://demo:demo@localhost:5432/sensors).
# These credentials are for a local teaching database only; do not reuse them.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: sensors
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d sensors"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
